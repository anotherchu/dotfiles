unbind r
bind r source-file ~/.config/tmux/tmux.conf

bind N new-session

set -g mouse on

# Synchronize tmux copy mode with the macOS system clipboard.
set -g set-clipboard on
set -s copy-command 'pbcopy'
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'pbcopy'
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel 'pbcopy'
bind-key -T copy-mode y send-keys -X copy-pipe-and-cancel 'pbcopy'
bind-key -T copy-mode Enter send-keys -X copy-pipe-and-cancel 'pbcopy'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'TanglingTreats/tmux-everforest'
set -g @tmux-everforest 'dark-medium'
set -g @plugin 'tmux-plugins/tmux-resurrect'

bind-key j next-window
bind-key k last-window

run '~/.tmux/plugins/tpm/tpm'
